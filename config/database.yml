default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: morbis_development
  username: postgres
  password: password
  host: db
  port: 5432

test:
  <<: *default
  database: morbis_test
  username: postgres
  password: password
  host: localhost
  port: 5432

production:
  <<: *default
  database: <%= ENV['DB_NAME'] || 'morbis_production' %>
  username: <%= ENV['DB_USER'] %>
  password: <%= ENV['DB_PASSWORD'] %>
  host: <%= ENV['DB_HOST'] %>
  port: <%= ENV['DB_PORT'] || 5432 %>
  ssl_mode: require
  # For DATABASE_URL environment variable
  url: <%= ENV['DATABASE_URL'] %>
